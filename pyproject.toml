[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "limit"
version = "1.0.0"
description = "Loosely coupled Modular framework for Isotope Transport (LIMIT)"
authors = [{name="Bikash Poudel"}]
dependencies = [
    "numpy",
    "scipy",
    "numba",
]

[project.optional-dependencies]
cmf = [
    "cmf>=2.0",
    "matplotlib",
]

dev = [
    "pytest",
    "black",
    "ruff"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]